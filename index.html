<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3eee6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Familia" />
  <title>Familia</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="setup" class="setup hidden">
    <div class="setup-mark">🏠</div>
    <h1>Gastos de la familia</h1>
    <p class="lead">Una pregunta a la vez: quién eres, qué pasó y de qué dinero salió.</p>
    <p class="sub">Escribe los nombres (3 o 4 personas).</p>
    <div id="setup-list" class="setup-list"></div>
    <button type="button" class="linkish" id="add-setup-member">+ Agregar otra persona</button>
    <p id="setup-error" class="error hidden"></p>
    <button type="button" class="btn primary" id="setup-go">Empezar</button>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div>
        <div class="brand">Familia</div>
        <div id="closed-flag" class="badge-closed hidden">Mes cerrado</div>
      </div>
      <div class="top-actions">
        <button type="button" class="month-btn" id="month-btn" aria-label="Cambiar mes"></button>
        <button type="button" class="icon-btn" id="gear-btn" aria-label="Ajustes">⚙</button>
      </div>
    </header>

    <main>
      <section id="view-agregar" class="view active">
        <div id="wizard-root"></div>
      </section>

      <section id="view-mensuales" class="view">
        <div id="mensuales-root"></div>
      </section>

      <section id="view-historial" class="view">
        <input class="search" id="search" type="search" placeholder="Buscar" />
        <div class="filters" id="filter-tipo"></div>
        <div class="filters" id="filter-persona"></div>
        <div class="filters" id="filter-categoria"></div>
        <div id="historial-list"></div>
      </section>

      <section id="view-analisis" class="view">
        <div id="analisis-root"></div>
      </section>

      <section id="view-config" class="view">
        <div id="config-root"></div>
      </section>
    </main>

    <nav class="nav" aria-label="Principal">
      <button type="button" class="on" data-tab="agregar"><span class="ni">＋</span>Anotar</button>
      <button type="button" data-tab="mensuales"><span class="ni">📅</span>Mensual</button>
      <button type="button" data-tab="historial"><span class="ni">☰</span>Lista</button>
      <button type="button" data-tab="analisis"><span class="ni">◉</span>Cuentas</button>
    </nav>
  </div>

  <div id="overlay" class="overlay hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="js/store.js"></script>
  <script src="js/wizard.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
